[package]
name = "resumegen"
version = "0.1.0"
edition = "2021"
description = "Deterministic ATS-compliant Resume & Cover Letter Generator and Application Tracker"
authors = ["Akshith Katkuri <akshithkatkuri14@gmail.com>"]
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
colored = "2.1"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
csv = "1.3"
chrono = "0.4"
walkdir = "2.5"
